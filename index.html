<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>درآمد و هزینه</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e8466" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1514" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="درآمد و هزینه">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
/* Operate surface: a daily-use money tool. Calm teal brand, one gold accent (the + coin), generous 44px+ targets,
   hairline grouped lists, category avatars for fast scanning, and short ease-out motion that never blocks input. */
:root {
  --bg: #f3f7f6;
  --surface: #ffffff;
  --surface-2: #edf3f1;
  --fg: #0e1f1c;
  --muted: #55696a;
  --line: #e0e9e6;
  --brand: #08705a;
  --brand-soft: #d5efe6;
  --on-brand: #ffffff;
  --hero-a: #0b8a69;
  --hero-b: #0d4668;
  --income: #137a3a;
  --income-soft: #dcf3e4;
  --expense: #c23a48;
  --gold: #f4b92f;
  --gold-ink: #3a2a00;
  --warn-solid: #e3a008;
  --warn-text: #865500;
  --warn-bg: #fff3d1;
  --warn-fg: #5a4200;
  --shadow: 0 8px 28px rgba(14, 31, 28, .14);
  --shadow-sm: 0 1px 2px rgba(14, 31, 28, .06);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --ava-bg: 74% 90%;
  --ava-fg: 62% 26%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1211; --surface: #121e1c; --surface-2: #1a2a27; --fg: #e6f1ef; --muted: #9db4b0; --line: #223633;
    --brand: #3fcfb0; --brand-soft: #16372f; --on-brand: #04211b; --hero-a: #0b6f58; --hero-b: #0c3a57;
    --income: #5bd48c; --income-soft: #17352a; --expense: #ff8a94; --gold-ink: #2e2200;
    --warn-solid: #f0b429; --warn-text: #f5cf72; --warn-bg: #3a2f10; --warn-fg: #ffe3a0;
    --shadow: 0 8px 28px rgba(0, 0, 0, .55); --shadow-sm: none;
    --ava-bg: 38% 22%; --ava-fg: 78% 80%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1211; --surface: #121e1c; --surface-2: #1a2a27; --fg: #e6f1ef; --muted: #9db4b0; --line: #223633;
  --brand: #3fcfb0; --brand-soft: #16372f; --on-brand: #04211b; --hero-a: #0b6f58; --hero-b: #0c3a57;
  --income: #5bd48c; --income-soft: #17352a; --expense: #ff8a94; --gold-ink: #2e2200;
  --warn-solid: #f0b429; --warn-text: #f5cf72; --warn-bg: #3a2f10; --warn-fg: #ffe3a0;
  --shadow: 0 8px 28px rgba(0, 0, 0, .55); --shadow-sm: none;
  --ava-bg: 38% 22%; --ava-fg: 78% 80%;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.7 "Vazirmatn", Tahoma, system-ui, sans-serif; touch-action: manipulation; }
[hidden] { display: none !important; }
.page {
  max-width: 560px; margin: 0 auto; min-height: 100vh;
  padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 132px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
svg { display: block; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; color: #fff; border-radius: 28px; padding: 20px 20px 18px;
  background: radial-gradient(120% 90% at 100% 0%, rgba(255, 255, 255, .16), transparent 55%), linear-gradient(155deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); }
.hero .label { font-size: 13px; opacity: .86; font-weight: 500; }
.hero .bal { font-size: 40px; font-weight: 700; line-height: 1.3; }
.hero .bal.neg { color: #ffd6da; }
.hero .unit { font-size: 14px; font-weight: 500; opacity: .86; margin-inline-start: 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat { background: rgba(255, 255, 255, .14); border-radius: 16px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 6px; }
.stat .k i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, .22); display: grid; place-items: center; }
.stat .k svg { width: 12px; height: 12px; }
.stat .v { font-size: 17px; font-weight: 600; }

/* ---------- lists ---------- */
.sec-h { font-size: 13px; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; }
.sec-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.sec-row .linkbtn { padding: 0 4px 6px; min-height: 36px; font-weight: 600; }
.list { background: var(--surface); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }
.item + .item { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 12px; width: 100%; padding: 11px 14px; background: none; border: 0; text-align: start; cursor: pointer; min-height: 62px;
  transition: background-color 120ms var(--ease-out), transform 140ms var(--ease-out); }
.row:active { transform: scale(.985); background: var(--surface-2); }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--surface-2); } }
.row .t { font-weight: 600; overflow-wrap: anywhere; line-height: 1.5; }
.row .s { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.5; }
.ava { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 16px;
  background: hsl(var(--h, 160) var(--ava-bg)); color: hsl(var(--h, 160) var(--ava-fg)); }
.ava.inc { background: var(--income-soft); color: var(--income); }
.ava svg { width: 18px; height: 18px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.amt { font-weight: 700; white-space: nowrap; font-size: 15.5px; }
.amt.inc { color: var(--income); }
.amt.exp { color: var(--expense); }
.acts { display: flex; gap: 8px; padding: 0 14px 12px 14px; align-items: center; flex-wrap: wrap; }
.acts .msg { font-size: 13px; color: var(--muted); flex: 1 1 100%; }
.empty { background: var(--surface); border-radius: 20px; padding: 30px 20px; text-align: center; color: var(--muted); box-shadow: 0 0 0 1px var(--line); margin-top: 14px; }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: 16px; padding: 12px 14px; margin-top: 14px; font-size: 13.5px; }

/* ---------- search & filter ---------- */
.toolbar { display: flex; gap: 8px; margin-top: 14px; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 16px; padding: 0 14px; box-shadow: 0 0 0 1px var(--line); min-height: 48px; color: var(--muted);
  transition: box-shadow 140ms var(--ease-out); }
.search:focus-within { box-shadow: 0 0 0 2px var(--brand); }
.search svg { width: 18px; height: 18px; flex: none; }
.search input { border: 0; background: none; min-height: 44px; padding: 0; border-radius: 0; color: var(--fg); outline: 0; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.fbtn { position: relative; width: 48px; flex: none; border: 0; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; cursor: pointer; color: var(--fg);
  transition: transform 140ms var(--ease-out); }
.fbtn:active { transform: scale(.94); }
.fbtn svg { width: 20px; height: 20px; }
.fbtn .dot { position: absolute; top: -5px; inset-inline-end: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-style: normal; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.fchip { border: 0; background: var(--brand-soft); color: var(--brand); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 32px; transition: transform 140ms var(--ease-out); }
.fchip:active { transform: scale(.96); }
.fsum { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 13px; color: var(--muted); margin: 14px 4px 0; }
.fsum b { color: var(--fg); }

/* ---------- tags ---------- */
.tag { display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 12px; line-height: 1.5; padding: 0 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 0; }
button.tag { min-height: 32px; padding: 0 12px; cursor: pointer; font-size: 13px; transition: transform 140ms var(--ease-out); }
button.tag:active { transform: scale(.95); }
button.tag.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.taginput { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px; min-height: 48px; }
.taginput:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
#fTagChips { display: contents; }
.taginput input { flex: 1 1 120px; min-width: 100px; border: 0; background: none; padding: 4px; min-height: 36px; outline: 0; border-radius: 0; }
.tagsug { display: flex; flex-wrap: wrap; gap: 6px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- plan: budgets & goals ---------- */
.plan-sum { background: var(--surface); border-radius: 20px; padding: 14px 16px 16px; box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); margin-bottom: 12px; }
.plan-sum .k { font-size: 12.5px; color: var(--muted); }
.plan-sum .v { font-size: 26px; font-weight: 700; line-height: 1.4; }
.plan-sum .v small { font-size: 13px; font-weight: 500; color: var(--muted); }
.plan-sum .v.neg { color: var(--expense); }
.plan-sum .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
.brow { display: block; width: 100%; text-align: start; background: none; border: 0; padding: 13px 16px 14px; cursor: pointer; min-height: 72px; transition: background-color 120ms var(--ease-out), transform 140ms var(--ease-out); }
.brow + .brow { border-top: 1px solid var(--line); }
.brow:active { transform: scale(.985); background: var(--surface-2); }
@media (hover: hover) and (pointer: fine) { .brow:hover { background: var(--surface-2); } }
.bn { font-weight: 600; overflow-wrap: anywhere; }
.bsub { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); margin-top: 7px; flex-wrap: wrap; }
.bsub .ok { color: var(--income); } .bsub .warn { color: var(--warn-text); } .bsub .over { color: var(--expense); font-weight: 600; }
.gsum .bsub { margin-top: 8px; }

/* ---------- report ---------- */
.bar-row { padding: 12px 16px; }
.bar-row + .bar-row { border-top: 1px solid var(--line); }
.bar-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.bar.tall { height: 10px; }
.bar > i { display: block; height: 100%; background: var(--expense); border-radius: 99px; transform-origin: right center; }
.bar > i.ok { background: var(--income); }
.bar > i.warn { background: var(--warn-solid); }
.bar > i.over { background: var(--expense); }
.bar > i.goalbar { background: var(--brand); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 10px 14px; text-align: end; white-space: nowrap; }
th:first-child, td:first-child { text-align: start; }
thead th { color: var(--muted); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--line); }
tbody tr + tr td { border-top: 1px solid var(--line); }

/* ---------- more tab ---------- */
.menu { display: grid; }
.menu button { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: 0; padding: 14px 16px; text-align: start; cursor: pointer; min-height: 60px; transition: background-color 120ms var(--ease-out), transform 140ms var(--ease-out); }
.menu button:active { transform: scale(.985); background: var(--surface-2); }
@media (hover: hover) and (pointer: fine) { .menu button:hover { background: var(--surface-2); } }
.menu button + button { border-top: 1px solid var(--line); }
.menu button > span:first-child { font-weight: 600; }
.menu button > span[aria-hidden] { color: var(--muted); font-size: 20px; }
.menu small { color: var(--muted); font-size: 12.5px; display: block; font-weight: 400; }
.hint { font-size: 13px; color: var(--muted); margin: 10px 4px; }
.steps { margin: 0 0 8px; padding-inline-start: 22px; display: grid; gap: 10px; }
.steps li::marker { color: var(--brand); font-weight: 700; }

/* ---------- controls ---------- */
.btn { min-height: 48px; border: 0; border-radius: 14px; padding: 0 18px; font-weight: 600; cursor: pointer; transition: transform 140ms var(--ease-out), opacity 140ms var(--ease-out), filter 140ms var(--ease-out); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.ghost { background: var(--surface-2); }
.btn.danger { background: var(--expense); color: #fff; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn.block { width: 100%; }
@media (hover: hover) and (pointer: fine) { .btn.primary:hover, .btn.danger:hover { filter: brightness(1.06); } .btn.ghost:hover { filter: brightness(.97); } }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 16px; margin-bottom: 14px; }
.seg.three { grid-template-columns: 1fr 1fr 1fr; }
.seg button { border: 0; background: none; min-height: 44px; border-radius: 12px; cursor: pointer; font-weight: 600; color: var(--muted); transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), box-shadow 160ms var(--ease-out), transform 140ms var(--ease-out); }
.seg button:active { transform: scale(.97); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.seg button.on[data-type="income"], .seg button.on[data-ft="income"] { color: var(--income); }
.seg button.on[data-type="expense"], .seg button.on[data-ft="expense"] { color: var(--expense); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-height: 48px; width: 100%;
  transition: border-color 140ms var(--ease-out), box-shadow 140ms var(--ease-out); }
input:focus, select:focus, textarea:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
textarea { resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 16px; padding: 12px 14px; margin: 4px 0 14px; font-size: 14px; }
.warn .btns { display: flex; gap: 8px; margin-top: 10px; }
.chip { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.chip.ok { color: var(--income); background: var(--income-soft); }
.chip.bad, .chip.over { color: var(--expense); background: color-mix(in srgb, var(--expense) 14%, transparent); }
.chip.warn { color: var(--warn-text); background: var(--warn-bg); }

/* ---------- auth ---------- */
.authbox { background: var(--surface); border-radius: 28px; padding: 26px 20px 22px; margin-top: 5vh; box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.authbox .logo { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 14px; }
.authbox h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.5; }
.authbox .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }
.authbox input[type="email"], .authbox input[type="password"] { direction: ltr; text-align: left; }
.err { color: var(--expense); font-size: 13.5px; min-height: 24px; margin: 2px 0 8px; }
.okmsg { color: var(--income); font-size: 13.5px; margin: 2px 0 10px; }
.linkbtn { background: none; border: 0; color: var(--brand); padding: 8px 4px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500; }
.row-links { display: flex; justify-content: space-between; flex-wrap: wrap; margin-top: 6px; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; inset: auto 0 0 0; background: color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); z-index: 20;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar > div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr; align-items: center; }
.tab { background: none; border: 0; min-height: 54px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); cursor: pointer; font-weight: 500; }
.tab .ti { width: 54px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background-color 180ms var(--ease-out), transform 140ms var(--ease-out); }
.tab:active .ti { transform: scale(.92); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--brand); font-weight: 700; }
.tab[aria-current="page"] .ti { background: var(--brand-soft); }
.fab { width: 58px; height: 58px; margin: -26px auto 0; border-radius: 50%; border: 4px solid var(--bg); background: linear-gradient(160deg, #f9cc52, var(--gold)); color: var(--gold-ink); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow);
  transition: transform 160ms var(--ease-out); }
.fab:active { transform: scale(.93); }
.fab svg { width: 26px; height: 26px; }

/* ---------- sheet & toast ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(6, 16, 14, .5); z-index: 30; }
.sheet { position: fixed; inset: auto 0 0 0; z-index: 31; background: var(--surface); border-radius: 28px 28px 0 0; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; max-width: 560px; margin: 0 auto;
  padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); box-shadow: var(--shadow); }
.sheet::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 4px; background: var(--line); }
.sheet-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-h h2 { margin: 0; font-size: 18px; line-height: 1.5; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 22px; line-height: 1; cursor: pointer; transition: transform 140ms var(--ease-out); }
.x:active { transform: scale(.92); }
.toast { position: fixed; z-index: 40; inset: calc(12px + env(safe-area-inset-top, 0px)) 0 auto 0; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.toast span { background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); max-width: 100%; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .backdrop { animation: fade 200ms var(--ease-out); }
  .sheet { animation: up 320ms var(--ease-drawer); }
  .toast span { animation: pop 220ms var(--ease-out); }
  .bar > i { animation: grow 520ms var(--ease-out) backwards; }
  .authbox { animation: rise 360ms var(--ease-out) backwards; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes pop { from { transform: translateY(-8px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes grow { from { transform: scaleX(.02); } to { transform: none; } }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) {
  .backdrop, .sheet { animation: fade 150ms linear; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>
</head>
<body>

<div class="page" dir="rtl" lang="fa">
  <div id="hero"></div>

  if (f.from || f.to) c.push(["date", `${f.from ? toFa(showJ(f.from)) : "…"} تا ${f.to ? toFa(showJ(f.to)) : "…"}`]);
  return c.length ? `<div class="fchips">${c.map(([k, l]) => `<button class="fchip" data-clr="${k}" aria-label="حذف فیلتر ${esc(l)}">${esc(l)} <span aria-hidden="true">×</span></button>`).join("")}</div>` : "";
}
function filterCount() {
  const f = state.filter; return (f.type !== "all") + !!f.cat + !!f.tag + !!(f.from || f.to);
}

function viewTx() {
  if (!state.loaded) return `<div class="empty"><b>در حال بارگذاری…</b>داده‌ها را از ذخیره‌سازی می‌خوانم.</div>` +

function viewReport() {
  if (!state.loaded) return viewTx();
  const cats = new Map(), months = new Map(), tagsM = new Map();
  for (const t of state.txs) {
    if (t.type === "expense") {
      cats.set(t.category || "بدون دسته", (cats.get(t.category || "بدون دسته") || 0) + t.amount);
      for (const g of t.tags) tagsM.set(g, (tagsM.get(g) || 0) + t.amount);
    }
    const [y, m] = isoToJ(t.date);
    const k = `${y}-${pad2(m)}`;
    const o = months.get(k) || { inc: 0, exp: 0 };
    if (t.type === "income") o.inc += t.amount; else o.exp += t.amount;
    months.set(k, o);
  }
  if (!state.txs.length) return `<div class="empty" style="margin-top:20px"><b>گزارشی نیست</b>بعد از ثبت چند تراکنش اینجا پر می‌شود.</div>`;
  const barsOf = (map, label) => {
    const sorted = [...map.entries()].sort((a, b) => b[1] - a[1]);
    const total = sorted.reduce((s, [, v]) => s + v, 0), top = sorted.length ? sorted[0][1] : 1;
    return sorted.length ? sorted.map(([c, v]) => `<div class="bar-row"><div class="bar-top"><span>${label(c)}</span><span>${num(v)} <span class="chip">${toFa(Math.round((v / total) * 100))}٪</span></span></div><div class="bar"><i style="width:${Math.max(2, (v / top) * 100)}%"></i></div></div>`).join("") : `<div class="bar-row" style="color:var(--muted)">هزینه‌ای ثبت نشده.</div>`;
  };
  const rows = [...months.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1)).map(([k, o]) => {
    const [y, m] = k.split("-").map(Number);
    return `<tr><td>${MONTHS[m - 1]} ${toFa(y)}</td><td>${num(o.inc)}</td><td>${num(o.exp)}</td><td>${num(o.inc - o.exp)}</td></tr>`;
  }).join("");
  return `<div class="sec-h">هزینه به تفکیک دسته</div><div class="list">${barsOf(cats, esc)}</div>
    ${tagsM.size ? `<div class="sec-h">هزینه به تفکیک برچسب</div><div class="list">${barsOf(tagsM, (g) => "#" + esc(g))}</div>` : ""}
    <div class="sec-h">گزارش ماهانه</div><div class="list tbl-wrap"><table><thead><tr><th>ماه</th><th>درآمد</th><th>هزینه</th><th>مانده</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- برنامه‌ریزی: بودجه و هدف ---------- */
const curJ = () => isoToJ(todayISO());
function budgetClass(spent, limit) { const r = spent / limit; return r > 1 ? "over" : r >= 0.8 ? "warn" : "ok"; }
function viewPlan() {
  if (!state.loaded) return viewTx();
  if (state.noPlan) return `<div class="notice" style="margin-top:0"><b>بخش برنامه‌ریزی هنوز فعال نشده.</b><br>فایل <span class="num">supabase_setup.sql</span> نسخه‌ی جدید را یک بار در SQL Editor اجرا کن، بعد صفحه را رفرش کن.</div>`;
  const [jy, jm] = curJ(), spent = monthSpentByCat(state.txs, jy, jm);
  const cats = Object.keys(state.budgets).sort((a, b) => (spent.get(b) || 0) / state.budgets[b] - (spent.get(a) || 0) / state.budgets[a]);
  let tl = 0, ts = 0;
  for (const c of cats) { tl += state.budgets[c]; ts += spent.get(c) || 0; }
  const daysLeft = jMonthLen(jy, jm) - curJ()[2] + 1;
  const left = tl - ts;
  const sum = cats.length ? `<div class="plan-sum"><div><div class="k">باقی‌مانده‌ی بودجه</div><div class="v ${left < 0 ? "neg" : ""}">${snum(left < 0 ? "−" : "", Math.abs(left))} <small>${unitLabel()}</small></div></div>
      <div class="meta"><span>${toFa(daysLeft)} روز تا آخر ماه</span>${left > 0 ? `<span>روزی ${num(Math.floor(left / daysLeft))}</span>` : `<span>از سقف گذشته‌ای</span>`}</div>
      <div class="bar tall"><i class="${budgetClass(ts, tl || 1)}" style="width:${Math.min(100, tl ? (ts / tl) * 100 : 0)}%"></i></div></div>` : "";
  const brows = cats.map((c) => {
    const lim = state.budgets[c], sp = spent.get(c) || 0, cls = budgetClass(sp, lim), pct = Math.round((sp / lim) * 100);
    return `<button class="brow" data-budget="${esc(c)}"><div class="bar-top"><span class="bn">${esc(c)}</span><span class="chip ${cls}">${toFa(pct)}٪</span></div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(100, (sp / lim) * 100)}%"></i></div>
      <div class="bsub"><span>${num(sp)} از ${num(lim)}</span><span class="${cls}">${sp > lim ? `${num(sp - lim)} بیشتر` : `${num(lim - sp)} مانده`}</span></div></button>`;
  }).join("");
  const budgets = `<div class="sec-row"><div class="sec-h">بودجه‌ی ${MONTHS[jm - 1]} ${toFa(jy)}</div><button class="linkbtn" data-act="budget-new">+ بودجه‌ی جدید</button></div>` + sum +
    (cats.length ? `<div class="list">${brows}</div><p class="hint">بودجه برای هر ماه تکرار می‌شود و فقط هزینه‌های همان ماه شمسی را می‌شمارد.</p>`
      : `<div class="empty"><b>هنوز بودجه‌ای نداری</b>برای هر دسته‌ی هزینه (مثلاً خوراک) سقف ماهانه بگذار تا بدانی چقدر مانده.<div style="margin-top:12px"><button class="btn primary sm" data-act="budget-new">ساخت اولین بودجه</button></div></div>`);
  const today = todayISO();
  const grows = state.goals.map((g) => {
    const pct = Math.min(100, Math.round((g.saved / g.target) * 100)), done = g.saved >= g.target;
    let dl = "";
    if (g.deadline) {
      const d = daysBetween(today, g.deadline), rem = g.target - g.saved;
      dl = done ? "" : d < 0 ? `<span class="over">${toFa(-d)} روز از موعد گذشته</span>` : `<span>${toFa(d)} روز مانده${rem > 0 ? ` · ماهی ${num(Math.ceil(rem / Math.max(1, d / 30)))}` : ""}</span>`;
    }
    return `<button class="brow goal" data-goal="${esc(g.id)}"><div class="bar-top"><span class="bn">${esc(g.title)}</span><span class="chip ${done ? "ok" : ""}">${done ? "رسیدی ✓" : toFa(pct) + "٪"}</span></div>
      <div class="bar"><i class="${done ? "ok" : "goalbar"}" style="width:${pct}%"></i></div>
      <div class="bsub"><span>${num(g.saved)} از ${num(g.target)}</span>${dl || "<span></span>"}</div></button>`;
  }).join("");
  const goals = `<div class="sec-row"><div class="sec-h">اهداف پس‌انداز</div><button class="linkbtn" data-act="goal-new">+ هدف جدید</button></div>` +
    (state.goals.length ? `<div class="list">${grows}</div><p class="hint">مبلغ هدف از موجودی حساب کم نمی‌شود؛ فقط برای پیگیری پس‌انداز است.</p>`
      : `<div class="empty"><b>هنوز هدفی نداری</b>مثلاً «سفر» یا «صندوق اضطراری» با مبلغ و تاریخ مقصد، و واریزهایت را ثبت کن.<div style="margin-top:12px"><button class="btn primary sm" data-act="goal-new">ساخت اولین هدف</button></div></div>`);
  return budgets + goals;
}

function liveFormat(el, allowNeg) {
  const raw = el.value;
  const n = normDigits(raw).replace(/−/g, "-");
  const neg = allowNeg && n.trim().startsWith("-");
  const digits = n.replace(/\D/g, "").slice(0, 15);
  const body = digits ? toFa(Number(digits).toLocaleString("en-US").replace(/,/g, "٬")) : "";
  const out = (neg ? "-" : "") + body;
  if (out === raw) return;
  const cur = el.selectionStart ?? raw.length;
  const before = normDigits(raw.slice(0, cur)).replace(/\D/g, "").length;
  el.value = out;
  let pos = before === 0 ? (neg ? 1 : 0) : out.length, seen = 0;
  if (before > 0) for (let i = 0; i < out.length; i++) { if (/[۰-۹]/.test(out[i])) { seen++; if (seen === before) { pos = i + 1; break; } } }
  try { el.setSelectionRange(pos, pos); } catch (e) { /* ignore */ }
}

const fmtInput = (n) => toFa(Number(n).toLocaleString("en-US").replace(/,/g, "٬"));

function tagCounts() {
  const m = new Map();
  for (const t of state.txs) for (const g of t.tags) m.set(g, (m.get(g) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]).map(([g]) => g);
}

/* گزارش بودجه بعد از ثبت یک هزینه */
function budgetNote(cat, iso) {
  const lim = state.budgets[cat];
  if (!lim || !cat) return "";
  const [jy, jm] = curJ(), [a, b] = monthBounds(jy, jm);
  if (iso < a || iso > b) return "";
  const sp = monthSpentByCat(state.txs, jy, jm).get(cat) || 0;
  if (sp > lim) return `بودجه‌ی «${cat}» از سقف گذشت`;
  if (sp / lim >= 0.8) return `${toFa(Math.round((sp / lim) * 100))}٪ بودجه‌ی «${cat}» مصرف شد`;
  return "";
}

    tin.addEventListener("input", () => { if (/[,،]/.test(tin.value)) commitTags(); });
    tin.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); commitTags(); } else if (e.key === "Backspace" && !tin.value && tags.length) { tags.pop(); drawTags(); } });
    tin.addEventListener("blur", () => { if (tin.value.trim()) commitTags(); });
    root.addEventListener("click", (e) => {
      const rm = e.target.closest("[data-tagrm]"), ad = e.target.closest("[data-tagadd]");
      if (rm) { tags.splice(+rm.dataset.tagrm, 1); drawTags(); }
      if (ad) { tags = cleanTagsIn([...tags, ad.dataset.tagadd]); drawTags(); }
    });
    amount.addEventListener("input", () => { liveFormat(amount, false); warn.hidden = true; });
    root.querySelectorAll("[data-type]").forEach((b) => b.addEventListener("click", () => {
      type = b.dataset.type; warn.hidden = true;
      root.querySelectorAll("[data-type]").forEach((x) => x.classList.toggle("on", x === b));
    }));
    const save = async (force) => {
      if (tin.value.trim()) commitTags();
      const amt = parseAmountInput(amount.value, false);
      const iso = parseDateInput($("#fDate", root).value);
      if (!amt || amt <= 0) { toast("مبلغ را درست وارد کن"); amount.focus(); return; }
      if (!iso) { toast("تاریخ را مثل ۱۴۰۵/۰۸/۱۹ وارد کن"); return; }
      if (type === "expense" && !force) {
        const cur = totals().bal;
        const before = edit ? (existing.type === "income" ? existing.amount : -existing.amount) : 0; // اثر تراکنش قدیمی روی موجودی
        const after = cur - before - amt;
        if (after < 0 && after < cur) {
          warn.hidden = false;
          warn.innerHTML = `با ثبت این هزینه موجودی حسابت منفی می‌شود.<br>موجودی بعد از ثبت: ${num(after)} ${unitLabel()}<br><b>مطمئنی که می‌خوای این هزینه ثبت بشه؟</b><div class="btns"><button class="btn danger sm" id="fForce">بله، ثبت کن</button><button class="btn ghost sm" id="fCancel">انصراف</button></div>`;
          $("#fForce", root).addEventListener("click", () => save(true));
          $("#fCancel", root).addEventListener("click", () => { warn.hidden = true; });
          return;
        }
      }
      const btn = $("#fSave", root); btn.disabled = true;
      const cat = $("#fCat", root).value.trim();
      const data = { date: iso, amount: amt, type, category: cat, note: $("#fNote", root).value.trim(), tags, ts: edit ? existing.ts : Date.now() };
      try {
        if (edit) { state.expanded = null; await ref.update(existing.id, data); } else await ref.add(data);
        closeSheet();
        const bn = type === "expense" ? budgetNote(cat, iso) : "";
        toast((edit ? "تغییرات ذخیره شد" : "ثبت شد") + (bn ? ` · ${bn}` : ""));
      } catch (e) {
        btn.disabled = false;
        toast(dbErrorMessage(e, edit ? "ویرایش تراکنش ذخیره نشد" : "ثبت تراکنش انجام نشد"));
      }
    };
    $("#fSave", root).addEventListener("click", () => save(false));
    amount.focus();
  });
}

function openGoal(id) {
  const g = state.goals.find((x) => x.id === id); if (!g) return;
  const left = Math.max(0, g.target - g.saved), pct = Math.min(100, Math.round((g.saved / g.target) * 100));
  openSheet(g.title, `
    <div class="gsum"><div class="bar tall"><i class="${g.saved >= g.target ? "ok" : "goalbar"}" style="width:${pct}%"></i></div>
      <div class="bsub"><span>${num(g.saved)} از ${num(g.target)} ${unitLabel()}</span><span>${g.saved >= g.target ? "رسیدی ✓" : `${num(left)} مانده`}</span></div></div>
    <div class="field" style="margin-top:14px"><label for="gAmt">مبلغ (${unitLabel()})</label><input id="gAmt" inputmode="numeric" autocomplete="off" placeholder="۰"></div>
    <div class="two"><button class="btn primary" id="gAdd">واریز به هدف</button><button class="btn ghost" id="gSub">برداشت از هدف</button></div>
    <div class="two" style="margin-top:10px"><button class="btn ghost sm" id="gEdit">ویرایش هدف</button><button class="btn ghost sm" id="gDel">حذف هدف</button></div>
    <div id="gDelBox"></div>`, (root) => {
    const amt = $("#gAmt", root);
    amt.addEventListener("input", () => liveFormat(amt, false));
    const move = async (sign) => {
      const a = parseAmountInput(amt.value, false);
      if (!a || a <= 0) { toast("مبلغ را درست وارد کن"); amt.focus(); return; }
      const next = g.saved + sign * a;
      if (next < 0) { toast("بیشتر از مبلغ پس‌اندازشده نمی‌شود برداشت"); return; }
      try { await ref.goal.update(g.id, { saved: next }); closeSheet(); toast(next >= g.target && g.saved < g.target ? "تبریک! به هدفت رسیدی" : sign > 0 ? "واریز ثبت شد" : "برداشت ثبت شد"); }
      catch (e) { toast("ثبت نشد؛ دوباره امتحان کن"); }
    };
    $("#gAdd", root).addEventListener("click", () => move(1));
    $("#gSub", root).addEventListener("click", () => move(-1));
    $("#gEdit", root).addEventListener("click", () => openGoalForm(g));
    $("#gDel", root).addEventListener("click", () => {
      $("#gDelBox", root).innerHTML = `<div class="warn" style="margin-top:12px">این هدف حذف شود؟<div class="btns"><button class="btn danger sm" id="gYes">بله، حذف کن</button><button class="btn ghost sm" id="gNo">نه</button></div></div>`;
      $("#gNo", root).addEventListener("click", () => { $("#gDelBox", root).innerHTML = ""; });
      $("#gYes", root).addEventListener("click", async () => { try { await ref.goal.del(g.id); closeSheet(); toast("هدف حذف شد"); } catch (e) { toast("حذف نشد"); } });
    });
  });
}

function openSms() {
  let parsed = [];
  openSheet("وارد کردن از پیامک بلو", `
    <p class="hint" style="margin-top:0">پیامک‌ها را کپی و اینجا پیست کن (چند پیامک پشت‌سرهم هم اشکالی ندارد).</p>

    <div class="two">
      <div class="field"><label for="sUnit">ذخیره با واحد</label><select id="sUnit"><option value="toman">تومان</option><option value="rial">ریال</option></select></div>

    </div>
    <button class="btn ghost block" id="sGo">تحلیل پیامک‌ها</button>
    <div id="sInfo" class="hint" aria-live="polite"></div>
    <div id="sList"></div>

    $("#sUnit", root).value = state.settings.unit;
    const amountOf = (p) => ($("#sUnit", root).value === "toman" ? Math.max(Math.round(p.amountRial / 10), 1) : p.amountRial);
    const noteOf = (p) => `پیامک بلو ${p.time}`.trim();
    const isDup = (p) => p.type && state.txs.some((t) => t.date === p.date && t.amount === amountOf(p) && t.type === p.type && (t.note || "") === noteOf(p));
    const drawList = () => {
      const ready = parsed.filter((p) => p.type && !isDup(p)).length;
      $("#sList", root).innerHTML = parsed.length ? `<div class="list">${parsed.map((p, i) => {
        const st = !p.type ? ["نوع نامشخص", "bad"] : isDup(p) ? ["تکراری", ""] : ["آماده", "ok"];
        return `<div class="item"><div class="row" style="cursor:default"><div><div class="t"><span class="amt ${p.type === "income" ? "inc" : p.type === "expense" ? "exp" : ""}">${snum(p.type === "income" ? "+" : p.type === "expense" ? "−" : "؟", amountOf(p))}</span></div><div class="s">${esc(longJ(p.date))}${p.time ? " · " + esc(toFa(p.time)) : ""} <span class="chip ${st[1]}">${st[0]}</span></div></div>
        <div style="display:flex;gap:6px"><button class="btn ghost sm" data-flip="${i}">${p.type === "income" ? "به هزینه" : "به درآمد"}</button><button class="btn ghost sm" data-rm="${i}" aria-label="حذف از لیست">×</button></div></div></div>`;
      }).join("")}</div>` : "";
      const imp = $("#sImport", root);
      imp.hidden = !parsed.length; imp.disabled = !ready;
      imp.textContent = ready ? `ثبت ${toFa(ready)} تراکنش آماده` : "چیزی برای ثبت نیست";
    };
    $("#sUnit", root).addEventListener("change", drawList);
    $("#sGo", root).addEventListener("click", () => {
      const r = parseSms($("#sText", root).value);
      parsed = r.items;
      $("#sInfo", root).textContent = `${toFa(r.items.length)} پیامک خوانده شد${r.skipped ? `، ${toFa(r.skipped)} مورد نادیده گرفته شد` : ""}.`;
      drawList();
    });
    $("#sList", root).addEventListener("click", (e) => {
      const f = e.target.closest("[data-flip]"), d = e.target.closest("[data-rm]");
      if (f) { const p = parsed[+f.dataset.flip]; p.type = p.type === "income" ? "expense" : "income"; drawList(); }
      if (d) { parsed.splice(+d.dataset.rm, 1); drawList(); }
    });
    $("#sImport", root).addEventListener("click", async () => {
      if (importing) return; importing = true;
      const btn = $("#sImport", root); btn.disabled = true;
      let ok = 0, skip = 0;
      const doneKeys = new Set(); // تکراری‌های درون همین دسته؛ لیست اصلی دست نمی‌خورد
      try {
        for (const p of parsed) {
          const k = [p.date, amountOf(p), p.type, noteOf(p)].join("|");
          if (!p.type || isDup(p) || doneKeys.has(k)) { skip++; continue; }
          const data = { date: p.date, amount: amountOf(p), type: p.type, category: $("#sCat", root).value.trim(), note: noteOf(p), ts: Date.now() };
          await ref.add(data);
          doneKeys.add(k);
          ok++;
        }
        closeSheet(); toast(`${toFa(ok)} تراکنش ثبت شد${skip ? `، ${toFa(skip)} مورد رد شد` : ""}`);
      } catch (e) { toast(`فقط ${toFa(ok)} مورد ثبت شد؛ دوباره امتحان کن`); btn.disabled = false; }
      importing = false;
    });
    $("#sText", root).focus();
  });
}

let sb = null, session = null, recoveryFlag = false, lastReload = 0;
const LEGACY_KEY = "finance_manager_v1";

function loadScript(url, ms) {
  return new Promise((res, rej) => {
    const s = document.createElement("script"); const t = setTimeout(() => { s.remove(); rej(new Error("timeout")); }, ms);
    s.src = url; s.onload = () => { clearTimeout(t); res(); }; s.onerror = () => { clearTimeout(t); s.remove(); rej(new Error("load")); };
    document.head.appendChild(s);
  });
}
async function loadLib() {
  if (window.supabase && window.supabase.createClient) return true;
  const urls = [
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.3/dist/umd/supabase.js",
    "https://unpkg.com/@supabase/supabase-js@2.93.3/dist/umd/supabase.js",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js",
  ];
  for (const u of urls) {
    try { await loadScript(u, 9000); if (window.supabase && window.supabase.createClient) return true; } catch (e) { /* بعدی */ }
  }
  return false;
}

function makeCloudRef(userId) {
  const docs = new Map();
  let listener = null;
  const snap = () => ({ docs: [...docs].map(([id, v]) => ({ id, data: () => v })), metadata: { fromCache: false } });
  const emit = () => { if (listener) listener(snap()); };
  const cap = { tags: true, plan: true };
  const COLS = () => "id,date,amount,type,category,note,created_at" + (cap.tags ? ",tags" : "");
  const GCOLS = "id,title,target,saved,deadline,created_at";
  const missing = (e) => !!e && (["42703", "42P01", "PGRST204", "PGRST205"].includes(e.code) || /column|relation|schema cache|does not exist/i.test(e.message || ""));
  const rowToDoc = (r) => ({ date: r.date, amount: Number(r.amount), type: r.type, category: r.category || "", note: r.note || "", tags: Array.isArray(r.tags) ? r.tags : [], ts: Date.parse(r.created_at) || 0 });
  const docToRow = (d) => { const o = { date: d.date, amount: d.amount, type: d.type, category: d.category || "", note: d.note || "" }; if (cap.tags) o.tags = parseTags(d.tags || []); return o; };
  const goalDoc = (r) => ({ _k: "goal", title: r.title, target: Number(r.target), saved: Number(r.saved) || 0, deadline: r.deadline || "", ts: Date.parse(r.created_at) || 0 });

  async function loadAll() {
    const fresh = new Map();
    const PAGE = 1000; // سرور در هر درخواست حداکثر ۱۰۰۰ ردیف می‌دهد؛ پس صفحه‌به‌صفحه می‌خوانیم
    for (let from = 0; ; from += PAGE) {
      let { data, error } = await sb.from("transactions").select(COLS()).order("date", { ascending: false }).order("created_at", { ascending: false }).order("id").range(from, from + PAGE - 1);
      if (error && cap.tags && missing(error)) { cap.tags = false; ({ data, error } = await sb.from("transactions").select(COLS()).order("date", { ascending: false }).order("created_at", { ascending: false }).order("id").range(from, from + PAGE - 1)); }
      if (error) throw error;
      data.forEach((r) => fresh.set(r.id, rowToDoc(r)));
      if (data.length < PAGE) break;
    }
    const st = await sb.from("settings").select("opening,unit").maybeSingle();
    if (st.error) throw st.error;
    if (st.data) fresh.set("settings", { opening: Number(st.data.opening) || 0, unit: st.data.unit });
    const bu = await sb.from("budgets").select("category,amount");
    if (bu.error) { if (missing(bu.error)) cap.plan = false; else throw bu.error; }
    else bu.data.forEach((r) => fresh.set("b:" + r.category, { _k: "budget", category: r.category, amount: Number(r.amount) }));
    if (cap.plan) {
      const go = await sb.from("goals").select(GCOLS).order("created_at", { ascending: true });
      if (go.error) { if (missing(go.error)) cap.plan = false; else throw go.error; }
      else go.data.forEach((r) => fresh.set("g:" + r.id, goalDoc(r)));
    }
    docs.clear(); fresh.forEach((v, k) => docs.set(k, v));
  }

  return {
    cap,
    async reload() { await loadAll(); emit(); },
    onSnapshot(next) { listener = next; emit(); return () => { listener = null; }; },
    async add(data) {
      const { data: row, error } = await sb.from("transactions").insert(docToRow(data)).select(COLS()).single();
      if (error) throw error;
      docs.set(row.id, rowToDoc(row)); emit(); return { id: row.id };
    },
    async update(id, data) {
      const { data: row, error } = await sb.from("transactions").update(docToRow(data)).eq("id", id).select(COLS()).single();
      if (error) throw error;
      docs.set(id, rowToDoc(row)); emit();
    },
    budget: {
      async set(category, amount) {
        const { error } = await sb.from("budgets").upsert({ user_id: userId, category, amount: Math.round(amount) }, { onConflict: "user_id,category" });
        if (error) throw error;
        docs.set("b:" + category, { _k: "budget", category, amount: Math.round(amount) }); emit();
      },
      async del(category) {
        const { error } = await sb.from("budgets").delete().eq("category", category);
        if (error) throw error;
        docs.delete("b:" + category); emit();
      },
    },
    goal: {
      async add(g) {
        const { data: row, error } = await sb.from("goals").insert({ title: g.title, target: g.target, saved: g.saved || 0, deadline: g.deadline || null }).select(GCOLS).single();
        if (error) throw error;
        docs.set("g:" + row.id, goalDoc(row)); emit();
      },
      async update(id, patch) {
        const { data: row, error } = await sb.from("goals").update(patch).eq("id", id).select(GCOLS).single();
        if (error) throw error;
        docs.set("g:" + id, goalDoc(row)); emit();
      },
      async del(id) {
        const { error } = await sb.from("goals").delete().eq("id", id);
        if (error) throw error;
        docs.delete("g:" + id); emit();
      },
    },
    async addMany(list, onProgress) {
      let done = 0;
      try {
        for (let i = 0; i < list.length; i += 200) {
          const chunk = list.slice(i, i + 200).map(docToRow);
          const { data, error } = await sb.from("transactions").insert(chunk).select(COLS());
          if (error) throw error;
          data.forEach((r) => docs.set(r.id, rowToDoc(r)));
          done += data.length; emit(); if (onProgress) onProgress(done);
        }
      } catch (e) { e.done = done; throw e; }
      return done;
    },
    doc(id) {
      return {
        async set(d) {
          if (id !== "settings") throw new Error("unsupported");
          const row = { user_id: userId, opening: Math.round(d.opening), unit: d.unit };
          const { error } = await sb.from("settings").upsert(row, { onConflict: "user_id" });
          if (error) throw error;
          docs.set("settings", { opening: row.opening, unit: row.unit }); emit();
        },
        async delete() {
          const { error } = await sb.from("transactions").delete().eq("id", id);
          if (error) throw error;
          docs.delete(id); emit();
        },
      };
    },
  };
}

function handleSnapshot(snap) {
  const txs = [], budgets = {}, goals = []; let settings = { opening: 0, unit: "toman" };
  snap.docs.forEach((d) => {
    const v = d.data(); if (!v) return;
    if (d.id === "settings") settings = { opening: Number(v.opening) || 0, unit: v.unit === "rial" ? "rial" : "toman" };
    else if (v._k === "budget") budgets[String(v.category)] = Number(v.amount) || 0;
    else if (v._k === "goal") goals.push({ id: d.id.slice(2), title: String(v.title || ""), target: Number(v.target) || 1, saved: Number(v.saved) || 0, deadline: v.deadline ? String(v.deadline) : "", ts: Number(v.ts) || 0 });
    else if ((v.type === "income" || v.type === "expense") && Number.isFinite(Number(v.amount))) txs.push({ id: d.id, date: String(v.date), amount: Number(v.amount), type: v.type, category: String(v.category || ""), note: String(v.note || ""), tags: Array.isArray(v.tags) ? parseTags(v.tags) : [], ts: Number(v.ts) || 0 });
  });
  txs.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts));
  goals.sort((a, b) => a.ts - b.ts);
  state.txs = txs; state.settings = settings; state.budgets = budgets; state.goals = goals; state.loaded = true;
  if (ref && ref.cap) { state.noPlan = !ref.cap.plan; state.schemaOld = !ref.cap.tags; }
  render();
}

function readLegacy() {
  try {
    const raw = localStorage.getItem(LEGACY_KEY); if (!raw) return null;
    const docsObj = JSON.parse(raw) || {}; const items = []; let settings = null;
    for (const [id, v] of Object.entries(docsObj)) {
      if (id === "settings") settings = { opening: Number(v.opening) || 0, unit: v.unit === "rial" ? "rial" : "toman" };
      else if (v && (v.type === "income" || v.type === "expense") && Number(v.amount) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(String(v.date))) items.push({ date: String(v.date), amount: Math.round(Number(v.amount)), type: v.type, category: String(v.category || ""), note: String(v.note || "") });
    }
    return items.length || settings ? { items, settings, raw } : null;
  } catch (e) { return null; }
}
async function migrateLegacy() {
  const lg = state.legacy; if (!lg || importing) return;
  importing = true; toast("در حال انتقال…");
  try {
    const key = (t) => [t.date, t.amount, t.type, t.category || "", t.note || ""].join("|");
    const have = new Set(state.txs.map(key));
    const fresh = lg.items.filter((t) => !have.has(key(t)));
    const accountWasEmpty = !state.txs.length && state.settings.opening === 0; // قبل از اضافه‌کردن بررسی می‌شود
    if (fresh.length) await ref.addMany(fresh);
    if (lg.settings && accountWasEmpty) await saveSettings({ opening: lg.settings.opening, unit: lg.settings.unit });
    try { localStorage.setItem(LEGACY_KEY + "_migrated", lg.raw); localStorage.removeItem(LEGACY_KEY); } catch (e) { /* ignore */ }
    state.legacy = null; renderView(); toast(`${toFa(fresh.length)} تراکنش منتقل شد`);
  } catch (e) { toast("انتقال کامل نشد؛ دوباره امتحان کن (تکراری‌ها رد می‌شوند)"); }
  importing = false;
}

async function onSession(s) {
  if (s && session && session.user.id === s.user.id) { session = s; return; }
  if (!s) { session = null; ref = null; state.txs = []; state.loaded = false; state.legacy = null; state.expanded = null; state.budgets = {}; state.goals = []; state.filter = { ...EMPTY_FILTER }; state.mode = "auth"; state.authTab = "login"; render(); return; }
  session = s; state.loaded = false; state.mode = "app"; state.tab = "tx"; state.limit = 60;
  ref = makeCloudRef(s.user.id);
  state.legacy = readLegacy(); state.legacyDismissed = false;
  render();
  try { await ref.reload(); ref.onSnapshot(handleSnapshot); }
  catch (e) { state.slow = true; render(); toast("خواندن اطلاعات انجام نشد؛ اینترنت را بررسی کن"); ref.onSnapshot(handleSnapshot); }
}

function faAuthError(e) {
  const m = String((e && (e.code || e.message)) || "").toLowerCase();
  if (m.includes("invalid_credentials") || m.includes("invalid login")) return "ایمیل یا رمز اشتباه است.";
  if (m.includes("already") || m.includes("user_already_exists")) return "این ایمیل قبلاً ثبت شده؛ وارد شو.";
  if (m.includes("email_not_confirmed") || m.includes("not confirmed")) return "ایمیل هنوز تأیید نشده؛ ایمیلت را بررسی کن.";
  if (m.includes("weak_password") || m.includes("password should")) return "رمز ضعیف است؛ طولانی‌تر و پیچیده‌تر انتخاب کن.";
  if (m.includes("rate") || m.includes("429")) return "تعداد تلاش‌ها زیاد بود؛ چند دقیقه بعد دوباره امتحان کن.";
  if (m.includes("signup_disabled") || m.includes("signups not allowed")) return "ثبت‌نام جدید غیرفعال است.";
  if (m.includes("failed to fetch") || m.includes("network") || m.includes("fetch")) return "اتصال به سرور برقرار نشد؛ اینترنت یا فیلترشکن را بررسی کن.";
  return "خطا: " + (e && (e.code || e.message) ? String(e.code || e.message).slice(0, 80) : "نامشخص");
}

async function authClick(kind) {

(async function init() {

  recoveryFlag = /type=recovery/.test(location.hash);
  if (!(await loadLib())) { state.mode = "nolib"; render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange((evt, s) => {
    // طبق توصیه‌ی Supabase داخل این تابع مستقیم درخواست نمی‌زنیم
    setTimeout(() => {
      if (evt === "PASSWORD_RECOVERY") { recoveryFlag = true; state.mode = "recovery"; render(); return; }
      if (recoveryFlag) return;
      if (evt === "SIGNED_OUT") onSession(null);
      else if (s && (evt === "SIGNED_IN" || evt === "INITIAL_SESSION")) onSession(s);
    }, 0);
  });
  const { data } = await sb.auth.getSession();
  if (recoveryFlag) { state.mode = "recovery"; render(); return; }
  await onSession(data.session);
})();
</script>
</body>
